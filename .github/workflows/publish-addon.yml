name: Push Add-on to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'addon/**'
      - '.github/workflows/publish-addon.yml'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Check clasp secrets
        id: check
        run: |
          if [ -z "${{ secrets.CLASP_CREDENTIALS }}" ] || [ -z "${{ secrets.CLASP_SCRIPT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLASP_CREDENTIALS / CLASP_SCRIPT_ID secrets not set - skipping Apps Script push. Run 'clasp login' locally and add ~/.clasprc.json contents as CLASP_CREDENTIALS, plus your script ID as CLASP_SCRIPT_ID."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup clasp credentials
        if: steps.check.outputs.configured == 'true'
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
          echo '{"scriptId":"${{ secrets.CLASP_SCRIPT_ID }}","rootDir":"."}' > addon/.clasp.json

      - name: Push to Apps Script
        if: steps.check.outputs.configured == 'true'
        run: cd addon && clasp push --force

      - name: Verify
        if: steps.check.outputs.configured == 'true'
        run: echo "Add-on code pushed to Apps Script successfully"
